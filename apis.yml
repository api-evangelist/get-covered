apis:
- name: Get Covered Platform API
  description: 'The Get Covered platform API — the integration surface that syncs resident,
    lease, policy, vendor certificate and invoice data two-way with property management
    systems (Yardi, Entrata, RealPage OneSite, AppFolio, MRI, ResMan) and powers the
    resident renters-insurance portal at renters.getcoveredinsurance.com. The host is
    live and serves an API reference at /api-docs, but that reference is gated behind
    HTTP Basic authentication (WWW-Authenticate: Basic), so no public machine-readable
    contract (OpenAPI, Swagger, GraphQL SDL or AsyncAPI) could be harvested. Access is
    arranged through Get Covered directly.'
