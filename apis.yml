aid: get-covered
name: Get Covered
description: 'GetCovered, Inc. (Get Covered) is a New York-headquartered insurtech
  and property-risk technology company, founded in 2017, that consolidates fragmented
  insurance and compliance workflows for multifamily property management portfolios
  into a single platform. Its six verticals are renters insurance (HO4, master policy
  and TLL programs), security deposits (cash, surety and alternative deposits), animal
  and ESA screening, vendor certificate-of-insurance compliance, Spend IQ procurement
  and invoice validation, and review monitoring — layered with an AI tier branded GetHub
  (portfolio data and claims) and Cora (a conversational resident agent). The company
  reports 3M+ units live across 42 licensed states (NAIC #18224), with insurance services
  offered through GetCovered Insurance Services, LLC. Its platform API syncs resident,
  policy, vendor and invoice data two-way at the lease level with property management
  systems including Yardi, Entrata, RealPage OneSite, AppFolio, MRI and ResMan. The
  API itself is a partner/integration surface: the API reference at api.getcoveredinsurance.com/api-docs
  is behind HTTP Basic authentication and no OpenAPI, llms.txt or /.well-known documents
  are published publicly.'
