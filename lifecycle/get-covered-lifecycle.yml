summary: >-
  Get Covered publishes no API versioning policy, no deprecation or sunset policy, no
  SLA document and no publicly viewable status page. An Atlassian Statuspage tenant
  exists at getcovered.statuspage.io and is titled "Get Covered Status", but it returns
  "Page Inactive — this page is currently inactive and can only be viewed by team
  members", so it is NOT a public status surface and no `StatusPage` pointer is emitted.
  The only availability signal the company publishes is a static footer line, "All
  systems operational · 99.98% uptime · 12 mo", which is marketing copy on the site
  rather than a live status feed.
